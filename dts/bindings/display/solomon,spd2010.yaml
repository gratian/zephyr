include: [spi-device.yaml, display-controller.yaml, lcd-controller.yaml]

title: Solomon Systech SPD2020 display controller

description: |
    The Solomon Systech SPD2010 also known as L-WEA2010 is a 24bit
    color display driver IC which supports LCD pannels with a maximum
    454x454 resolution.

compatible: "solomon,spd2010"

properties:
  reset-gpios:
    type: phandle-array
    description: RESET pin.

      The RESET pin of SPD2010 is active low.
      If connected directly the MCU pin should be configured
      as active low.
